# flake8 configuration for PySimplePMT.
#
# The codebase wraps at about 84 columns; 100 keeps the signal usable -
# the few dozen longer lines already in the tree are flagged, and
# anything new and runaway still shows up.
#
# W291/W293 are ignored: several hundred lines of historical trailing
# whitespace would drown out every real finding. E402 is ignored because
# GUI and optional-dependency imports are deliberately deferred into
# functions (a module-level import of a missing piece would crash the
# whole application, not just the feature needing it).
[flake8]
max-line-length = 100
extend-ignore = W291,W293,E402
