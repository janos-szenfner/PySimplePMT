name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without a leading v (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-deb:
    name: Build Ubuntu .deb
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # python3-tk provides the Tcl/Tk runtime PyInstaller bundles into the
      # package; fakeroot and dpkg-dev build the archive itself.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk xvfb fakeroot dpkg-dev fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Record the resolved dependency set
        run: |
          pip freeze > dependency-manifest.txt
          echo "Bundled dependencies:"
          cat dependency-manifest.txt

      - name: Determine the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version}"

      - name: Run the test suite
        run: xvfb-run -a python run_tests.py

      - name: Build the .deb
        run: ./packaging/build_deb.sh "${{ steps.version.outputs.version }}"

      - name: Install the package
        run: |
          deb=$(ls dist/*.deb)
          sudo apt-get install -y "./${deb}"

      # A package that installs but will not start is worse than a failed
      # build, so launch it against a virtual display and require that it
      # stays up. Exiting early means it crashed on startup.
      - name: Smoke test the installed application
        run: |
          set +e
          xvfb-run -a timeout 25 /usr/bin/pysimplepmt
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo "Application started and stayed running."
          else
            echo "Application exited early with status ${status}." >&2
            exit 1
          fi

      # Runs against the *installed* package, so it covers the .deb layout
      # rather than only the staging directory.
      - name: Verify the installed package is self-contained
        run: |
          echo "== Declared dependencies =="
          dpkg-deb --field "$(ls dist/*.deb)" Depends
          echo
          echo "== Version and dependency self-check =="
          /usr/bin/pysimplepmt --version
          /usr/bin/pysimplepmt --self-check
          echo
          echo "== The launcher must not invoke a system Python =="
          cat /usr/bin/pysimplepmt
          if grep -qE '\bpython3?\b' /usr/bin/pysimplepmt; then
            echo "ERROR: launcher depends on a system Python interpreter" >&2
            exit 1
          fi
          echo
          echo "== The bundle ships its own interpreter =="
          test -x /opt/pysimplepmt/pysimplepmt
          find /opt/pysimplepmt -maxdepth 2 -name 'libpython*' -o -maxdepth 2 -name 'python3*' | head

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pysimplepmt-${{ steps.version.outputs.version }}-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS
            dependency-manifest.txt
          retention-days: 30

      # Uploading assets to the releases API fails intermittently - a 39 MB
      # package went down with "other side closed" partway through, leaving
      # the tag pushed and no release at all. The gh CLI is preinstalled on
      # the runner, so the release is created and each asset uploaded with
      # explicit retries, then the result is verified.
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          notes_file="$(mktemp)"
          cat > "$notes_file" <<'NOTES'
          ## PySimplePMT VERSION_PLACEHOLDER

          ### Install on Ubuntu / Debian

          ```bash
          sudo apt install ./pysimplepmt_VERSION_PLACEHOLDER_amd64.deb
          ```

          Then launch it from your applications menu, or run `pysimplepmt`.

          ### Self-contained

          The package bundles the Python interpreter, the Tcl/Tk runtime and
          every third-party library. **No Python installation and no pip
          packages are required**, and nothing is downloaded at runtime.

          The exact set of bundled libraries is recorded in
          `dependency-manifest.txt`, and `SHA256SUMS` covers the package.

          ### Removal

          ```bash
          sudo apt remove pysimplepmt
          ```
          NOTES
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" "$notes_file"

          # Append GitHub's generated changelog. Asking gh for both
          # --notes-file and --generate-notes is rejected, so the notes are
          # fetched from the API and concatenated instead. Failing to get
          # them must not cost us the release, so it is best effort.
          if generated=$(gh api -X POST \
                "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                -f tag_name="$TAG" --jq '.body' 2>/dev/null); then
            printf '\n\n---\n\n%s\n' "$generated" >> "$notes_file"
          else
            echo "Could not fetch generated release notes; continuing." >&2
          fi

          prerelease=""
          prerelease_flag="--prerelease=false"
          case "$VERSION" in
            *-*)
              prerelease="--prerelease"
              prerelease_flag="--prerelease=true"
              ;;
          esac

          # Create the release if this tag does not already have one.
          #
          # "Already exists" includes a release GitHub has demoted to a draft,
          # which is what it does when the tag behind a published release is
          # deleted and re-pushed. gh sees the draft and reports success, so
          # this branch is reached with an invisible release - the state that
          # once produced a fully green run and no release on the releases
          # page. Publishing is forced below rather than assumed here.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release for $TAG already exists; reusing it."
          else
            for attempt in 1 2 3; do
              if gh release create "$TAG" \
                   --title "PySimplePMT ${VERSION}" \
                   --notes-file "$notes_file" \
                   $prerelease; then
                break
              fi
              echo "Release creation attempt ${attempt} failed; retrying..." >&2
              sleep $((attempt * 10))
            done
          fi

          gh release view "$TAG" >/dev/null

          # Upload each asset separately so one flaky transfer cannot lose
          # the rest, retrying and clobbering any partial upload
          upload() {
            local file="$1"
            for attempt in 1 2 3 4; do
              if gh release upload "$TAG" "$file" --clobber; then
                echo "Uploaded $(basename "$file")"
                return 0
              fi
              echo "Upload of $(basename "$file") attempt ${attempt} failed; retrying..." >&2
              sleep $((attempt * 15))
            done
            echo "ERROR: could not upload $(basename "$file")" >&2
            return 1
          }

          for asset in dist/*.deb dist/SHA256SUMS dependency-manifest.txt; do
            upload "$asset"
          done

          # Assets are attached, so the release is complete: take it out of
          # draft unconditionally. This is what turns a reused draft into a
          # visible release, and it is a no-op for one just created. The title
          # and notes are rewritten in the same call so a release carried over
          # from an earlier attempt does not keep that attempt's text.
          echo "Publishing ${TAG}"
          gh release edit "$TAG" \
            --title "PySimplePMT ${VERSION}" \
            --notes-file "$notes_file" \
            --draft=false \
            "$prerelease_flag"

      # A release missing its package is worse than a failed build, because
      # it looks finished. Fail loudly if anything did not make it up.
      - name: Verify the release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Assets attached to ${TAG}:"
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "  \(.name)  \(.size) bytes"'

          for required in ".deb" "SHA256SUMS" "dependency-manifest.txt"; do
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' \
                 | grep -q -- "$required"; then
              echo "ERROR: ${required} is missing from the release" >&2
              exit 1
            fi
          done
          echo "All expected assets are present."

          # A draft release is invisible to everyone but the repository's own
          # maintainers, so a complete set of assets is not on its own proof
          # that anything was published. gh reads drafts happily, which is how
          # a green run previously reported success against a release nobody
          # could download.
          if [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" != "false" ]; then
            echo "ERROR: ${TAG} is still a draft and is not publicly visible" >&2
            exit 1
          fi

          # Confirmed a second time through the by-tag endpoint, which is how
          # an installer or a download script finds a release. Authenticated
          # so it draws on the token's rate limit rather than the 60 requests
          # an hour shared by everything running from the runner's address,
          # which would otherwise fail a perfectly good release.
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
               --jq '.html_url'; then
            echo "ERROR: ${TAG} cannot be resolved by tag" >&2
            exit 1
          fi
          echo "Release ${TAG} is published and visible."
