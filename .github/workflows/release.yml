name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without a leading v (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-deb:
    name: Build Ubuntu .deb
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      # python3-tk provides the Tcl/Tk runtime PyInstaller bundles into the
      # package; fakeroot and dpkg-dev build the archive itself.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk xvfb fakeroot dpkg-dev fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Record the resolved dependency set
        run: |
          pip freeze > dependency-manifest.txt
          echo "Bundled dependencies:"
          cat dependency-manifest.txt

      - name: Determine the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version}"

      - name: Run the test suite
        run: xvfb-run -a python run_tests.py

      - name: Build the .deb
        run: ./packaging/build_deb.sh "${{ steps.version.outputs.version }}"

      - name: Install the package
        run: |
          deb=$(ls dist/*.deb)
          sudo apt-get install -y "./${deb}"

      # A package that installs but will not start is worse than a failed
      # build, so launch it against a virtual display and require that it
      # stays up. Exiting early means it crashed on startup.
      - name: Smoke test the installed application
        run: |
          set +e
          xvfb-run -a timeout 25 /usr/bin/pysimplepmt
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo "Application started and stayed running."
          else
            echo "Application exited early with status ${status}." >&2
            exit 1
          fi

      # Runs against the *installed* package, so it covers the .deb layout
      # rather than only the staging directory.
      - name: Verify the installed package is self-contained
        run: |
          echo "== Declared dependencies =="
          dpkg-deb --field "$(ls dist/*.deb)" Depends
          echo
          echo "== Version and dependency self-check =="
          /usr/bin/pysimplepmt --version
          /usr/bin/pysimplepmt --self-check
          echo
          echo "== The launcher must not invoke a system Python =="
          cat /usr/bin/pysimplepmt
          if grep -qE '\bpython3?\b' /usr/bin/pysimplepmt; then
            echo "ERROR: launcher depends on a system Python interpreter" >&2
            exit 1
          fi
          echo
          echo "== The bundle ships its own interpreter =="
          test -x /opt/pysimplepmt/pysimplepmt
          find /opt/pysimplepmt -maxdepth 2 -name 'libpython*' -o -maxdepth 2 -name 'python3*' | head

      # An icon nobody can see is a silent failure: the launcher works, the
      # menu entry appears, and it wears a generic cog. Checked against the
      # *installed* tree, and against the name the desktop entry actually
      # asks for rather than the one we think it asks for.
      - name: Verify the installed icons and desktop entry
        run: |
          set -euo pipefail

          entry=/usr/share/applications/pysimplepmt.desktop
          test -f "$entry"
          echo "== Desktop entry =="
          cat "$entry"

          echo
          echo "== It validates =="
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          desktop-file-validate "$entry"

          echo
          echo "== The icon it names is installed under that name =="
          icon=$(sed -n 's/^Icon=//p' "$entry")
          echo "  Icon=${icon}"
          found=0
          for size in 16 24 32 48 64 128 256; do
            file="/usr/share/icons/hicolor/${size}x${size}/apps/${icon}.png"
            if [ -s "$file" ]; then
              found=$((found + 1))
              file "$file"
            else
              echo "ERROR: ${file} is missing from the installed package" >&2
              exit 1
            fi
          done
          test -s "/usr/share/pixmaps/${icon}.png"
          echo "  ${found} sizes installed, plus the pixmaps fallback"

          echo
          echo "== The window class matches what the entry declares =="
          declared=$(sed -n 's/^StartupWMClass=//p' "$entry")
          actual=$(python3 -c "import sys; sys.path.insert(0, '.'); \
            from gantt_app.main import GanttApp; \
            print(GanttApp.WM_CLASS_NAME.capitalize())")
          echo "  entry declares ${declared}, the window is ${actual}"
          if [ "$declared" != "$actual" ]; then
            echo "ERROR: the desktop cannot match the window to its entry, so "\
                 "the dock and the switcher will show a generic icon" >&2
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pysimplepmt-${{ steps.version.outputs.version }}-deb
          path: |
            dist/*.deb
            dependency-manifest.txt
          retention-days: 30

    outputs:
      version: ${{ steps.version.outputs.version }}

  build-macos:
    name: Build macOS .app and .dmg
    # Apple Silicon. PyInstaller bundles the interpreter and the libraries of
    # the machine it runs on, so the runner's architecture *is* the build's -
    # macos-14 and later are arm64, and an Intel build would need an Intel
    # runner rather than a flag.
    runs-on: macos-14

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Record the resolved dependency set
        run: |
          pip freeze > dependency-manifest-macos.txt
          echo "Bundled dependencies:"
          cat dependency-manifest-macos.txt

      - name: Determine the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version} for $(uname -m)"

      # The macOS runner has a window server, so the widget tests run without
      # a virtual display.
      - name: Run the test suite
        run: python run_tests.py

      - name: Build the .app and the .dmg
        run: ./packaging/build_dmg.sh "${{ steps.version.outputs.version }}"

      # A bundle that builds but will not start is worse than a failed build.
      # --self-check imports every bundled dependency, which is what catches a
      # library PyInstaller failed to collect; the GUI itself is not launched,
      # since a windowed app on a headless runner has nothing to attach to.
      - name: Smoke test the bundle
        run: |
          app="dist/PySimplePMT.app/Contents/MacOS/pysimplepmt"
          "$app" --version
          "$app" --self-check

      - name: Verify the bundle is self-contained and correctly built
        run: |
          set -euo pipefail
          app="dist/PySimplePMT.app"

          echo "== Architecture =="
          arch=$(lipo -archs "${app}/Contents/MacOS/pysimplepmt")
          echo "  ${arch}"
          if [ "${arch}" != "arm64" ]; then
            echo "ERROR: expected an arm64 build, got ${arch}" >&2
            exit 1
          fi

          echo "== Bundle metadata =="
          plutil -p "${app}/Contents/Info.plist" \
            | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|CFBundleName|NSHighResolutionCapable'

          # On macOS the interpreter is bundled as a framework rather than
          # as a libpython dylib, which is what Linux gets
          echo "== It carries its own interpreter =="
          find "${app}/Contents" -maxdepth 3 -name 'Python*.framework' | head
          if [ -z "$(find "${app}/Contents" -name 'Python*.framework' -print -quit)" ]; then
            echo "ERROR: no bundled Python framework in the app" >&2
            exit 1
          fi

          echo "== It carries its own icon =="
          test -f "${app}/Contents/Resources/pysimplepmt.icns" \
            || ls "${app}/Contents/Resources"/*.icns

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pysimplepmt-${{ steps.version.outputs.version }}-macos
          path: |
            dist/*.dmg
            dist/*-app.zip
            packaging/README-macOS.md
            dependency-manifest-macos.txt
          retention-days: 30

    outputs:
      version: ${{ steps.version.outputs.version }}

  publish:
    name: Publish the GitHub release
    needs: [build-deb, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          # The whole history and every tag, because the release notes list
          # what changed since the previous one - and a shallow checkout has
          # neither the commits to list nor the tag to measure from.
          fetch-depth: 0

      # Both platforms' artifacts are gathered here rather than each job
      # publishing its own. A release that appears with only half its packages
      # on it looks finished and is not, and two jobs racing to create the
      # same release is how that happens.
      - name: Download every build artifact
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Collect the assets
        id: assets
        run: |
          set -euo pipefail
          mkdir -p release
          # What the release page shows, and nothing else. The .app zip and
          # the dependency manifests are still built and still uploaded as
          # workflow artifacts - they are useful when a build has to be
          # picked apart - but a release page listing nine files buries the
          # two anybody actually wants.
          find artifacts -type f \
            \( -name '*.deb' -o -name '*.dmg' -o -name 'README-macOS.md' \) \
            -exec cp {} release/ \;

          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          echo "Assets to publish:"
          ls -lh release/

          # A release missing a package is the failure worth catching early,
          # while the run can still be re-tried cheaply.
          for required in '*.deb' '*.dmg'; do
            if ! ls release/${required} >/dev/null 2>&1; then
              echo "ERROR: no ${required} was built" >&2
              exit 1
            fi
          done

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Uploading assets to the releases API fails intermittently - a 39 MB
      # package went down with "other side closed" partway through, leaving
      # the tag pushed and no release at all. The gh CLI is preinstalled on
      # the runner, so the release is created and each asset uploaded with
      # explicit retries, then the result is verified.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.assets.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          deb_name=$(basename "$(ls release/*.deb)")
          dmg_name=$(basename "$(ls release/*.dmg)")

          # What changed since the previous release.
          #
          # Built from the commit subjects rather than from GitHub's own
          # generated notes, which list merged pull requests - and this
          # repository commits straight to main, so that list comes back
          # empty. The subjects here are written to be read, so they make
          # the changelog on their own.
          #
          # The version bumps are left out. They are one line each, say
          # nothing that the heading above does not, and would otherwise be
          # half the list.
          previous=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="${previous}..${TAG}"
          else
            range="$TAG"
            echo "No earlier tag found; listing everything up to ${TAG}."
          fi

          # Subject *and* body. The subjects alone said what changed and
          # nothing about why, which is the half worth reading - and this
          # repository writes the why into the commit message, so it was
          # being thrown away at exactly the point somebody would look for
          # it. A reader of a release page should not have to go and find
          # the commits.
          raw_file="$(mktemp)"
          git log --no-merges --reverse \
                  --pretty=format:'<<<COMMIT>>>%n%s%n<<<BODY>>>%n%b' \
                  "$range" > "$raw_file"

          changes_file="$(mktemp)"
          python3 - "$raw_file" "$changes_file" <<'PY'
          import sys

          raw_path, out_path = sys.argv[1], sys.argv[2]
          with open(raw_path) as handle:
              raw = handle.read()

          sections = []
          for entry in raw.split('<<<COMMIT>>>'):
              if not entry.strip():
                  continue
              subject, _, body = entry.partition('<<<BODY>>>')
              subject = subject.strip()

              # The version bumps say nothing the heading above does not,
              # and would otherwise be half the list
              if not subject or subject.startswith('Bump version to'):
                  continue

              section = ['#### ' + subject]
              body = body.strip()
              if body:
                  section.append('')
                  section.append(body)
              sections.append('\n'.join(section))

          text = '\n\n'.join(sections)
          if not text.strip():
              text = 'Housekeeping only; see the commit history for detail.'

          with open(out_path, 'w') as handle:
              handle.write(text + '\n')
          PY

          echo "Changes since ${previous:-the beginning}:"
          cat "$changes_file"

          notes_file="$(mktemp)"
          cat > "$notes_file" <<'NOTES'
          ## PySimplePMT VERSION_PLACEHOLDER

          ### Changes

          CHANGES_PLACEHOLDER

          ### Packages

          * **macOS**: `.app` bundle (**Apple Silicon / arm64 only — not Intel**), DMG
          * **Linux**: DEB

          ### macOS installation notes

          The macOS app is **unsigned** (no Apple Developer certificate).

          **First launch:** right-click **PySimplePMT** in Applications →
          **Open** → click **Open** in the security dialog. Every launch after
          that is an ordinary double-click.

          See `README-macOS.md` attached below — it is also inside the
          DMG — for the full instructions, including what to do on macOS
          Sequoia (15), where the first attempt takes a different route.

          ### Installation

          Every file below carries the version without the leading `v`:
          `DEB_NAME_PLACEHOLDER`, `DMG_NAME_PLACEHOLDER`.

          **macOS**

          * **DMG**: mount it, drag **PySimplePMT** to **Applications**, then
            right-click → **Open**

          **Linux**

          ```bash
          sudo dpkg -i pysimplepmt_*.deb
          ```

          Or, which resolves the base system libraries for you:

          ```bash
          sudo apt install ./DEB_NAME_PLACEHOLDER
          ```

          Then launch it from your applications menu, or run `pysimplepmt`.

          ### Self-contained

          Both packages bundle the Python interpreter, the Tcl/Tk runtime and
          every third-party library. **No Python installation and no pip
          packages are required**, and nothing is downloaded at runtime.

          The exact set of bundled libraries is recorded in the build's own
          artifacts, under the Actions run that produced this release.
          `SHA256SUMS` covers every file attached here.

          ### Removal

          * **macOS**: drag **PySimplePMT** from Applications to the Bin
          * **Linux**: `sudo apt remove pysimplepmt`
          NOTES
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" "$notes_file"
          sed -i "s/DEB_NAME_PLACEHOLDER/${deb_name}/g" "$notes_file"
          sed -i "s/DMG_NAME_PLACEHOLDER/${dmg_name}/g" "$notes_file"

          # The changelog goes in by file rather than through sed: a subject
          # line may hold slashes, ampersands or backslashes, every one of
          # which sed would read as syntax.
          python3 - "$notes_file" "$changes_file" <<'PY'
          import sys

          notes_path, changes_path = sys.argv[1], sys.argv[2]
          with open(notes_path) as handle:
              notes = handle.read()
          with open(changes_path) as handle:
              changes = handle.read().rstrip('\n')

          with open(notes_path, 'w') as handle:
              handle.write(notes.replace('CHANGES_PLACEHOLDER', changes))
          PY

          # A link to the full diff, which is the one thing GitHub's own
          # generated notes were worth here. The rest of what they produce is
          # a list of merged pull requests, and this repository has none - so
          # the Changes section above replaces them rather than sitting
          # beside a second, emptier changelog.
          if [ -n "$previous" ]; then
            printf '\n\n**Full changelog**: %s/compare/%s...%s\n' \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "$previous" "$TAG" \
              >> "$notes_file"
          fi

          prerelease=""
          prerelease_flag="--prerelease=false"
          case "$VERSION" in
            *-*)
              prerelease="--prerelease"
              prerelease_flag="--prerelease=true"
              ;;
          esac

          # Create the release if this tag does not already have one.
          #
          # "Already exists" includes a release GitHub has demoted to a draft,
          # which is what it does when the tag behind a published release is
          # deleted and re-pushed. gh sees the draft and reports success, so
          # this branch is reached with an invisible release - the state that
          # once produced a fully green run and no release on the releases
          # page. Publishing is forced below rather than assumed here.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release for $TAG already exists; reusing it."
          else
            for attempt in 1 2 3; do
              if gh release create "$TAG" \
                   --title "PySimplePMT ${VERSION}" \
                   --notes-file "$notes_file" \
                   $prerelease; then
                break
              fi
              echo "Release creation attempt ${attempt} failed; retrying..." >&2
              sleep $((attempt * 10))
            done
          fi

          gh release view "$TAG" >/dev/null

          # Upload each asset separately so one flaky transfer cannot lose
          # the rest, retrying and clobbering any partial upload
          upload() {
            local file="$1"
            for attempt in 1 2 3 4; do
              if gh release upload "$TAG" "$file" --clobber; then
                echo "Uploaded $(basename "$file")"
                return 0
              fi
              echo "Upload of $(basename "$file") attempt ${attempt} failed; retrying..." >&2
              sleep $((attempt * 15))
            done
            echo "ERROR: could not upload $(basename "$file")" >&2
            return 1
          }

          for asset in release/*; do
            upload "$asset"
          done

          # Assets are attached, so the release is complete: take it out of
          # draft unconditionally. This is what turns a reused draft into a
          # visible release, and it is a no-op for one just created. The title
          # and notes are rewritten in the same call so a release carried over
          # from an earlier attempt does not keep that attempt's text.
          echo "Publishing ${TAG}"
          gh release edit "$TAG" \
            --title "PySimplePMT ${VERSION}" \
            --notes-file "$notes_file" \
            --draft=false \
            "$prerelease_flag"

      # A release missing a package is worse than a failed build, because it
      # looks finished. Fail loudly if anything did not make it up.
      - name: Verify the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Assets attached to ${TAG}:"
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "  \(.name)  \(.size) bytes"'

          for required in ".deb" ".dmg" "README-macOS.md" "SHA256SUMS"; do
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' \
                 | grep -q -- "$required"; then
              echo "ERROR: ${required} is missing from the release" >&2
              exit 1
            fi
          done
          echo "All expected assets are present."

          # A draft release is invisible to everyone but the repository's own
          # maintainers, so a complete set of assets is not on its own proof
          # that anything was published. gh reads drafts happily, which is how
          # a green run previously reported success against a release nobody
          # could download.
          if [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" != "false" ]; then
            echo "ERROR: ${TAG} is still a draft and is not publicly visible" >&2
            exit 1
          fi

          # Confirmed a second time through the by-tag endpoint, which is how
          # an installer or a download script finds a release. Authenticated
          # so it draws on the token's rate limit rather than the 60 requests
          # an hour shared by everything running from the runner's address,
          # which would otherwise fail a perfectly good release.
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
               --jq '.html_url'; then
            echo "ERROR: ${TAG} cannot be resolved by tag" >&2
            exit 1
          fi
          echo "Release ${TAG} is published and visible."
